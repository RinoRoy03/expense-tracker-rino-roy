<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple expense tracker to manage income and expenses.">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div>
                <h1>Expense Tracker</h1>
                <p>Track your income and expenses in one place.</p>
            </div>
        </header>

        <section class="summary" >
            <div class="summary-card income-card">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="summary-card expense-card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">₹0.00</p>
            </div>
            <div class="summary-card balance-card">
                <h3>Current Balance</h3>
                <p id="current-balance">₹0.00</p>
            </div>
        </section>

        <section class="panel">
               <h2>Category-wise Expense Summary</h2>
               <div id="expenseChart">
               <p class="empty-message">No expenses to display.</p>
                </div>
         </section>

        <section class="panel">
            <h2 id="form-heading">Add Transaction</h2>
            <form id="transactionForm" novalidate>
                <div class="form-grid">
                    <div class="field">
                        <label for="type">Transaction Type <span>*</span></label>   
                        <select id="type" name="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="amount">Amount (₹) <span>*</span></label>
                        <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 1500" required>
                    </div>
                    <div class="field">
                        <label for="category">Category <span>*</span></label>
                        <select id="category" name="category" required>
                            <option value="">Select category</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="date">Date <span>*</span></label>
                        <input id="date" name="date" type="date" required>
                    </div>
                    <div class="field field-full">
                        <label for="description">Description</label>
                        <input id="description" name="description" type="text" maxlength="100" placeholder="e.g. Monthly groceries">
                    </div>
                </div>
                <p id="formError" class="form-error" role="alert" ></p>
                <div class="form-actions">
                    <button id="submitButton" class="primary-btn" type="submit">Add Transaction</button>
                    <button id="cancelEdit" class="secondary-btn hidden" type="button">Cancel Edit</button>
                </div>
            </form>
        </section>

        <section class="panel history-panel">
            <div class="section-heading">
                <h2 id="history-heading">Transaction History</h2>
                <span id="transactionCount" class="count-label">0 transactions</span>
            </div>
            <div class="filters">
                <div class="field">
                    <label for="typeFilter">Type</label>
                    <select id="typeFilter">
                        <option value="all">All types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="field">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="all">All categories</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button id="clearFilters" class="secondary-btn filter-button" type="button">Clear Filters</button>
            </div>
            <div id="transactionList" class="transaction-list" >
                <p class="empty-message">No transactions yet. Add one using the form above.</p>
            </div>
        </section>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
